server:
  port: ${PORT:8080}
  # Render vb. proxy arkasında doğru şema/host (https, wss) için
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:h2:file:./data/dersbul;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate.jdbc.time_zone: UTC
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:dersbul-dev-secret-please-change-it-before-production-1234567890}
    expiration-hours: 24
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  # Demo kullanıcı ve ilanlar. Herkese açık bir ortamda SEED_DEMO=false yapın.
  seed-demo: ${SEED_DEMO:true}
  # Verilirse bu bilgilerle yönetici hesabı oluşturulur (en az 8 karakter şifre).
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Fiyatlar örnektir; yayına almadan önce gerçek değerlerle değiştirin.
  pricing:
    student-pass-try: 259
    teacher-pass-monthly-try: 149
    teacher-pass-yearly-try: 650
  # true ise öğrencinin mesaj yazabilmesi için aktif Öğrenci Pass gerekir (varsayılan: sohbet serbest).
  student-pass-required-for-chat: ${STUDENT_PASS_REQUIRED:false}
